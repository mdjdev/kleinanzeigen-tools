name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify version consistency
        run: |
          TAG_VERSION=${{ steps.get_version.outputs.version }}

          # 1. Script metadata
          SCRIPT_VERSION=$(grep -oP '@version\s+\K[0-9]+\.[0-9]+\.[0-9]+' kleinanzeigen-tools.js)
          if [ "$SCRIPT_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Script @version ($SCRIPT_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          # 2. README badge
          if ! grep -q "version-$TAG_VERSION-blue" README.md; then
            echo "Error: README.md version badge does not match tag ($TAG_VERSION)"
            exit 1
          fi

          # 3. CHANGELOG heading
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain section for version [$TAG_VERSION]"
            exit 1
          fi

          echo "All version checks passed for $TAG_VERSION"

      - name: Extract changelog section for release body
        id: changelog
        run: |
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          BODY=$(awk "/^## \[$TAG_VERSION\]/{found=1;next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "Error: No changelog content found for version [$TAG_VERSION]"
            exit 1
          fi
          {
            echo "## Changelog"
            echo ""
            echo "$BODY"
          } > "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          files: kleinanzeigen-tools.js
